<div class="container">
  <div class="header-container">
    <div class="title-wrapper">
      <h2>Danh mục đơn vị tính</h2>
    </div>
  </div>

  <div class="controls-container">
    <div class="header-actions">
      <button mat-flat-button class="btn-primary" (click)="openDialog()" matTooltip="Thêm mới">
        <mat-icon>add</mat-icon>
        <span>Thêm mới</span>
      </button>
      <button matButton="tonal" mat-flat-button class="btn-secondary" (click)="editSelected()" matTooltip="Chỉnh sửa">
        <mat-icon>edit</mat-icon>
        <span>Sửa</span>
      </button>
      <button mat-flat-button class="btn-warning" (click)="deleteSelected()" matTooltip="Xóa">
        <mat-icon>delete</mat-icon>
        <span>Xóa</span>
      </button>
      <button mat-flat-button class="btn-accent" (click)="importExcel()" matTooltip="Import từ Excel">
        <mat-icon>upload_file</mat-icon>
        <span>Import Excel</span>
      </button>
    </div>
    <div class="search-container">
      <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic">
        <mat-label>Tìm kiếm</mat-label>
        <input matInput [(ngModel)]="searchTerm" (input)="onSearchInput()" placeholder="Tìm theo mã, tên...">
        <mat-icon matPrefix>search</mat-icon>

        @if(searchTerm){
        <button matSuffix mat-icon-button aria-label="Clear" (click)="clearSearch()">
          <mat-icon>close</mat-icon>
        </button>
        }
      </mat-form-field>
    </div>
  </div>

  <div class="mat-elevation-z8 table-wrapper">
    @if(isLoading){
    <div class="loading-shade">
      <mat-spinner diameter="48"></mat-spinner>
    </div>
    }

    <div class="table-scroll">
      <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortChange($event)"
        class="full-width-table">

        <!-- Mã Column -->
        <ng-container matColumnDef="ma">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="ma">Mã</th>
          <td mat-cell *matCellDef="let row" [innerHTML]="row.ma | textHighlight:searchTerm" [title]="row.ma"></td>
        </ng-container>

        <!-- Tên Column -->
        <ng-container matColumnDef="ten">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="ten">Tên</th>
          <td mat-cell *matCellDef="let row" [innerHTML]="row.ten | textHighlight:searchTerm" [title]="row.ten"></td>
        </ng-container>

        <!-- Ghi chú Column -->
        <ng-container matColumnDef="ghiChu">
          <th mat-header-cell *matHeaderCellDef>Ghi chú</th>
          <td mat-cell *matCellDef="let row" [innerHTML]="(row.ghiChu || '-') | textHighlight:searchTerm"
            [title]="row.ghiChu || '-'"></td>
        </ng-container>

        <!-- Ngày hiệu lực Column -->
        <ng-container matColumnDef="ngayHieuLuc">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="ngayHieuLuc">Ngày hiệu lực</th>
          <td mat-cell *matCellDef="let row">{{row.ngayHieuLuc | date:'dd/MM/yyyy'}}</td>
        </ng-container>

        <!-- Ngày hết hiệu lực Column -->
        <ng-container matColumnDef="ngayHetHieuLuc">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="ngayHetHieuLuc">Ngày hết hiệu lực</th>
          <td mat-cell *matCellDef="let row">{{row.ngayHetHieuLuc | date:'dd/MM/yyyy'}}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="sticky-header"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selectRow(row)"
          [class.selected-row]="row === selectedRow"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="5">
            <div class="no-data-message">
              <mat-icon>info</mat-icon>
              <span>{{searchTerm ? 'Không tìm thấy kết quả phù hợp' : 'Không có dữ liệu đơn vị tính'}}</span>
            </div>
          </td>
        </tr>
      </table>
    </div>
  </div>
  <mat-paginator [length]="totalCount" [pageSize]="pageSize" [pageSizeOptions]="[50, 100, 150, 200]"
    (page)="onPageChange($event)" aria-label="Chọn trang" showFirstLastButtons>
  </mat-paginator>
</div>
