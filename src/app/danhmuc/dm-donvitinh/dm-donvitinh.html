<div class="container">
  <div class="header-container">
    <h2>Danh mục đơn vị tính</h2>
    <div class="header-actions">
      <button matButton="filled" mat-raised-button (click)="openDialog()" matTooltip="Thêm mới">
        <mat-icon>add</mat-icon> Thêm mới
      </button>
      <button matButton="tonal" mat-raised-button (click)="editSelected()" matTooltip="Chỉnh sửa">
        <mat-icon>edit</mat-icon> Sửa
      </button>
      <button color="warn" mat-raised-button (click)="deleteSelected()" matTooltip="Xóa">
        <mat-icon>delete</mat-icon> Xóa
      </button>
      <button mat-raised-button color="accent" (click)="importExcel()" matTooltip="Import từ Excel">
        <mat-icon>upload_file</mat-icon> Import Excel
      </button>
    </div>
  </div>

  <div class="mat-elevation-z8 table-container">
    <div class="loading-shade" *ngIf="isLoading">
      <mat-spinner></mat-spinner>
    </div>

    <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortChange($event)" class="full-width-table">

      <!-- Mã Column -->
      <ng-container matColumnDef="ma">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="ma">Mã</th>
        <td mat-cell *matCellDef="let row">{{row.ma}}</td>
      </ng-container>

      <!-- Tên Column -->
      <ng-container matColumnDef="ten">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="ten">Tên</th>
        <td mat-cell *matCellDef="let row">{{row.ten}}</td>
      </ng-container>

      <!-- Ghi chú Column -->
      <ng-container matColumnDef="ghiChu">
        <th mat-header-cell *matHeaderCellDef>Ghi chú</th>
        <td mat-cell *matCellDef="let row">{{row.ghiChu || '-'}}</td>
      </ng-container>

      <!-- Ngày hiệu lực Column -->
      <ng-container matColumnDef="ngayHieuLuc">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="ngayHieuLuc">Ngày hiệu lực</th>
        <td mat-cell *matCellDef="let row">{{row.ngayHieuLuc | date:'dd/MM/yyyy'}}</td>
      </ng-container>

      <!-- Ngày hết hiệu lực Column -->
      <ng-container matColumnDef="ngayHetHieuLuc">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="ngayHetHieuLuc">Ngày hết hiệu lực</th>
        <td mat-cell *matCellDef="let row">{{row.ngayHetHieuLuc | date:'dd/MM/yyyy'}}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selectRow(row)"
        [class.selected-row]="row === selectedRow"></tr>

      <!-- Hiển thị khi không có dữ liệu -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="5">
          <div class="no-data-message">
            <mat-icon>info</mat-icon>
            <span>{{searchTerm ? 'Không tìm thấy kết quả phù hợp' : 'Không có dữ liệu đơn vị tính'}}</span>
          </div>
        </td>
      </tr>
    </table>

    <mat-paginator [length]="totalCount" [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 25, 50, 100]"
      (page)="onPageChange($event)" aria-label="Chọn trang" showFirstLastButtons>
    </mat-paginator>
  </div>
</div>
