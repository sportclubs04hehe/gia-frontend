<div class="container">
  <h2>Quản lý đơn vị tính</h2>

  <div class="mat-elevation-z8 table-container">
    <div class="action-toolbar">
      <button mat-raised-button color="primary" (click)="openDialog()">
        <mat-icon>add</mat-icon> Thêm mới
      </button>
    </div>

    <div class="loading-shade" *ngIf="isLoading">
      <mat-spinner></mat-spinner>
    </div>

    <table mat-table [dataSource]="dataSource" matSort class="full-width-table">
      <!-- Mã Column -->
      <ng-container matColumnDef="ma">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Mã</th>
        <td mat-cell *matCellDef="let row">{{row.ma}}</td>
      </ng-container>

      <!-- Tên Column -->
      <ng-container matColumnDef="ten">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Tên</th>
        <td mat-cell *matCellDef="let row">{{row.ten}}</td>
      </ng-container>

      <!-- Ghi chú Column -->
      <ng-container matColumnDef="ghiChu">
        <th mat-header-cell *matHeaderCellDef>Ghi chú</th>
        <td mat-cell *matCellDef="let row">{{row.ghiChu || '-'}}</td>
      </ng-container>

      <!-- Ngày hiệu lực Column -->
      <ng-container matColumnDef="ngayHieuLuc">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Ngày hiệu lực</th>
        <td mat-cell *matCellDef="let row">{{row.ngayHieuLuc | date:'dd/MM/yyyy'}}</td>
      </ng-container>

      <!-- Ngày hết hiệu lực Column -->
      <ng-container matColumnDef="ngayHetHieuLuc">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Ngày hết hiệu lực</th>
        <td mat-cell *matCellDef="let row">{{row.ngayHetHieuLuc | date:'dd/MM/yyyy'}}</td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Thao tác</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="primary" (click)="openDialog(row)" matTooltip="Chỉnh sửa">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="delete(row.id)" matTooltip="Xóa">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Hiển thị khi không có dữ liệu -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="6">Không có dữ liệu đơn vị tính</td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Chọn trang"></mat-paginator>
  </div>
</div>
