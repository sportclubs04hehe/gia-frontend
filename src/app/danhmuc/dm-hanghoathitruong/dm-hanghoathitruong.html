<div class="container">
  <div class="header-container">
    <div class="title-wrapper">
      <h2>Danh mục hàng hóa thị trường</h2>
    </div>
  </div>

  <div class="controls-container">
    <div class="header-actions">
      <button mat-flat-button class="btn-primary" (click)="openDialog()" matTooltip="Thêm mới">
        <mat-icon>add</mat-icon>
        <span>Thêm mới</span>
      </button>
      <button mat-flat-button class="btn-secondary" (click)="editSelected()" matTooltip="Chỉnh sửa">
        <mat-icon>edit</mat-icon>
        <span>Sửa</span>
      </button>
      <button mat-flat-button class="btn-warning" (click)="deleteSelected()" matTooltip="Xóa">
        <mat-icon>delete</mat-icon>
        <span>Xóa</span>
      </button>
      <button mat-flat-button class="btn-accent" (click)="importExcel()" matTooltip="Import từ Excel">
        <mat-icon>upload_file</mat-icon>
        <span>Import Excel</span>
      </button>
    </div>
    <div class="search-container">
      <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic">
        <mat-label>Tìm kiếm</mat-label>
        <input matInput [(ngModel)]="searchTerm" (input)="onSearchInput()" placeholder="Tìm theo mã, tên...">
        <mat-icon matPrefix>search</mat-icon>
        <button *ngIf="searchTerm" matSuffix mat-icon-button aria-label="Clear" (click)="clearSearch()">
          <mat-icon>close</mat-icon>
        </button>
      </mat-form-field>
    </div>
  </div>

  <div class="mat-elevation-z8 table-wrapper">
    <div class="loading-shade" *ngIf="isLoading">
      <mat-spinner diameter="48"></mat-spinner>
    </div>

    <div class="table-scroll">
      <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortChange($event)" class="full-width-table">

        <!-- Mã hàng hóa Column -->
        <ng-container matColumnDef="ma">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="ma">Mã hàng hóa</th>
          <td mat-cell *matCellDef="let row" class="ma-hanghoa-cell" [ngClass]="{'parent-node': row.hasChildren}">
            <div class="tree-node-content" [style.margin-left]="getIndentation(row.level || 0)">
              <button
                *ngIf="hasChildren(row)"
                mat-icon-button
                (click)="toggleNode(row); $event.stopPropagation()"
                class="expand-button-inline">
                <mat-icon>{{isExpanded(row) ? 'expand_more' : 'chevron_right'}}</mat-icon>
              </button>
              <span *ngIf="!hasChildren(row)" class="leaf-spacer-inline"></span>
              <span class="ma-hanghoa-text" [innerHTML]="row.ma | textHighlight:searchTerm" [title]="row.ma"></span>
            </div>
          </td>
        </ng-container>

        <!-- Tên hàng hóa Column -->
        <ng-container matColumnDef="ten">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="ten">Tên hàng hóa</th>
          <td mat-cell *matCellDef="let row" [innerHTML]="row.ten | textHighlight:searchTerm" [title]="row.ten"></td>
        </ng-container>

        <!-- Đơn vị tính Column -->
        <ng-container matColumnDef="donViTinhTen">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="donViTinhTen">Đơn vị tính</th>
          <td mat-cell *matCellDef="let row" [innerHTML]="(row.donViTinhTen || '-') | textHighlight:searchTerm" [title]="row.donViTinhTen || '-'"></td>
        </ng-container>

        <!-- Đặc tính Column -->
        <ng-container matColumnDef="dacTinh">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="dacTinh">Đặc tính</th>
          <td mat-cell *matCellDef="let row" [innerHTML]="(row.dacTinh || '-') | textHighlight:searchTerm" [title]="row.dacTinh || '-'"></td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="sticky-header"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selectRow(row)"
          [class.selected-row]="row === selectedRow"
          [class.tree-level-0]="row.level === 0"
          [class.tree-level-1]="row.level === 1"
          [class.tree-level-2]="row.level === 2"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">
            <div class="no-data-message">
              <mat-icon>info</mat-icon>
              <span>{{searchTerm ? 'Không tìm thấy kết quả phù hợp' : 'Không có dữ liệu hàng hóa thị trường'}}</span>
            </div>
          </td>
        </tr>
      </table>
    </div>
  </div>

  <mat-paginator [length]="totalCount" [pageSize]="pageSize" [pageSizeOptions]="[50, 100, 200, 500]"
    (page)="onPageChange($event)" aria-label="Chọn trang" showFirstLastButtons>
  </mat-paginator>
</div>
